name: Despertador del backend

# Render (plan gratis) apaga el servicio tras 15 minutos sin visitas y el primer pedido
# después tarda 30-60 s en responder. Este flujo lo visita cada 10 minutos para que no
# se duerma. Pega en /health/ping, que no toca la base (así Neon puede dormir y no gasta horas).
#
# Es provisorio: al pasar Render a un plan pago (que no se apaga) se puede borrar este archivo.
# GitHub puede demorar unos minutos las corridas programadas; si hace falta algo más estricto,
# se puede apuntar un monitor externo (UptimeRobot, cron-job.org) a la misma dirección.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visitar el backend
        env:
          API_URL: ${{ vars.API_URL || 'https://nova-app-backend.onrender.com' }}
        run: |
          # Si estaba dormido tarda en arrancar: reintenta con espera.
          curl -fsS "$API_URL/health/ping" \
            --retry 3 --retry-delay 15 --retry-all-errors --max-time 60
