services:
  - type: web
    name: nova-app-backend
    env: node
    plan: starter
    rootDir: .
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Neon con pooler: el candado de migraciones (pg_advisory_lock) queda tomado en una
    # conexión del pooler y bloquea los deploys. Con una sola instancia no hace falta.
    startCommand: sh -c "PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK=1 npx prisma migrate deploy && node dist/main.js"
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK
        value: "1"
      - key: DATABASE_URL
        sync: false
      # Clave AES-256 de los datos personales de jugadores/socios (32 bytes en base64:
      # `openssl rand -base64 32`). Guardala también fuera de Render: sin ella los datos
      # cifrados no se pueden recuperar. No la cambies sin migrar los datos.
      - key: PII_ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_ADMIN_CREDENTIALS_PATH
        value: /etc/secrets/firebase-admin.json
