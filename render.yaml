services:
  - type: web
    name: nova-app-backend
    env: node
    plan: starter
    rootDir: .
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: sh -c "npx prisma migrate deploy && node dist/main.js"
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_ADMIN_CREDENTIALS_PATH
        value: /etc/secrets/firebase-admin.json
